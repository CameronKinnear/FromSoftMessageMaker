<!DOCTYPE html>



<html lang="en">
    <head>
        <link rel="stylesheet" href="style/erstyle.css">

        <h1>Elden Ring Message Maker</h1>
    </head>
    <body>
        <div id="window">
            <div id="leftWindow">
                <div id="selectionArea">
                    <div id="selectorLabelsGroup">
                        <label class="selectorLabel">Templates</label>
                        <label class="selectorLabel">Words</label>
                        <label class="selectorLabel">Conjunctions</label>
                        <label class="selectorLabel">Templates (2nd Line)</label>
                        <label class="selectorLabel">Words (2nd Line)</label>
                        <label class="selectorLabel">Gestures</label>
                    </div>
                    <div id="selectorButtonsGroup">
                        <button id="templatesbutton1" class="selectorButton templatesButton" data-renderonline="1"></button>
                        <button id="wordsbutton1" class="selectorButton wordsButton" data-renderonline="1"></button>
                        <button id="conjunctionsButton" class="selectorButton conjunctionsButton" data-renderonline="1"></button>
                        <button id="templatesbutton2" class="selectorButton templatesButton" data-renderonline="2"></button>
                        <button id="wordsbutton2" class="selectorButton wordsButton" data-renderonline="2"></button>
                        <button id="gesturesButton" class="selectorButton gestureButton" data-renderonline="3"></button>
                    </div>
                </div>

                <div id="messageRenderedArea">
                    <img id="gestureRender" width="100" height="100" style="min-width: 100;"></p>
                    <div id="textRenderArea">
                        <p id="line1Render"  class="text"></p>
                        <p id="line2Render" class="text"></p>
                    </div>
                </div>
            </div>
            
            <div id="selections">
                <h2 id="selectedHeader"></h2>
                <input type="text" id="selectionSearch" onkeyup="filterSelectionArea()" placeholder="Type to search items...">
                <div id="selectionArea">
                    <div id="selectionAreaCol1"></div>
                    <div id="selectionAreaCol2"></div>
                </div>
            </div>
        </div>
        <script src="scripts/messagehandler.js"></script>
    </body>
</html>
